<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTM — Alertas de Mercado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dashboard.css" rel="stylesheet">
</head>
<body class="dark-mode">

<!-- Sidebar -->
<aside id="sidebar" class="sidebar">
  <a class="sidebar-logo" href="dashboard.html">
    <img src="assets/logo.png" alt="OTM" style="width:38px;height:38px;flex-shrink:0;border-radius:6px;object-fit:cover">
    <div class="sidebar-logo-text">
      <span class="brand-name">OTM</span>
      <span class="brand-sub">Táchira · Venezuela</span>
    </div>
  </a>
  <nav class="sidebar-nav">
    <div class="nav-item-oicf"><a href="dashboard.html" class="nav-link-oicf"><i class="fas fa-tachometer-alt"></i><span class="nav-text">Dashboard</span></a></div>
    <div class="nav-item-oicf"><a href="alertas.html"   class="nav-link-oicf active"><i class="fas fa-bell"></i><span class="nav-text">Alertas</span></a></div>
    <div class="nav-item-oicf"><a href="reportes.html"  class="nav-link-oicf"><i class="fas fa-file-pdf"></i><span class="nav-text">Reportes</span></a></div>
    <div class="nav-item-oicf"><a href="login.html"     class="nav-link-oicf"><i class="fas fa-sign-out-alt"></i><span class="nav-text">Salir</span></a></div>
  </nav>
</aside>

<!-- Topbar -->
<header id="topbar" class="topbar">
  <button id="sidebar-toggle" class="btn-icon border-0" onclick="document.getElementById('sidebar').classList.toggle('collapsed');document.getElementById('topbar').classList.toggle('sidebar-collapsed');document.getElementById('main-content').classList.toggle('sidebar-collapsed')">
    <i class="fas fa-bars"></i>
  </button>
  <span class="topbar-title"><i class="fas fa-bell me-2 text-warning"></i>Panel de Alertas</span>
  <div class="topbar-actions">
    <span class="live-indicator"></span>
    <button class="btn-icon border-0" onclick="document.body.classList.toggle('dark-mode');document.body.classList.toggle('light-mode')"><i class="fas fa-sun"></i></button>
    <a href="dashboard.html" class="btn-icon border-0"><i class="fas fa-arrow-left"></i></a>
  </div>
</header>

<main id="main-content" class="main-content">
  <div class="content-inner">

    <!-- Config umbrales -->
    <div class="section-header">
      <div class="section-title"><span class="dot" style="background:#ef4444"></span>Configuración de Alertas</div>
    </div>
    <div class="card-oicf p-3 mb-4">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label-oicf fs-xs text-muted">Alerta Advertencia (%)</label>
          <input type="number" id="threshold-warn" value="5" min="1" max="50" class="form-control" style="background:#1e293b;color:#e2e8f0;border-color:#1e293b">
        </div>
        <div class="col-md-3">
          <label class="form-label-oicf fs-xs text-muted">Alerta Crítica (%)</label>
          <input type="number" id="threshold-crit" value="10" min="1" max="50" class="form-control" style="background:#1e293b;color:#e2e8f0;border-color:#1e293b">
        </div>
        <div class="col-md-3">
          <label class="form-label-oicf fs-xs text-muted">Commodity</label>
          <select id="alert-commodity" class="form-control" style="background:#1e293b;color:#e2e8f0;border-color:#1e293b">
            <option value="todos">Todos</option>
            <option value="carbon_energetico">Carbón Energético</option>
            <option value="carbon_coquizable">Carbón Coquizable</option>
            <option value="roca_fosfatica">Roca Fosfática</option>
          </select>
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-primary w-100" onclick="evaluarAlertas()">
            <i class="fas fa-sync-alt me-2"></i>Evaluar Alertas
          </button>
        </div>
      </div>
    </div>

    <!-- Alertas activas -->
    <div class="section-header">
      <div class="section-title"><span class="dot" style="background:#ef4444"></span>Alertas Activas</div>
      <span class="badge bg-danger" id="alert-count">0</span>
    </div>
    <div id="alertas-panel" class="mb-4"></div>

    <!-- Historial -->
    <div class="section-header">
      <div class="section-title"><span class="dot"></span>Historial de Alertas (últimas 24h)</div>
    </div>
    <div class="card-oicf p-3">
      <div id="historial-alertas"></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const ALERTAS_DEMO = [
  { nivel:'info',        icon:'✅', comd:'General',           msg:'Mercados estables. Sin movimientos significativos en las últimas 4 horas.' },
  { nivel:'warning',     icon:'⚠️', comd:'Carbón Energético', msg:'Variación diaria: -0.93%. Dentro de rango normal. Monitor activo.' },
  { nivel:'info',        icon:'📊', comd:'Roca Fosfática',    msg:'Precio en zona de soporte $85-90. Tendencia alcista confirmada (+5.4% mensual).' },
  { nivel:'info',        icon:'🌍', comd:'Carbón Coquizable', msg:'Demanda siderúrgica asiática sostiene precios. Variación +1.09% positiva.' }
];

const HISTORIAL_DEMO = [
  { hora:'14:30', nivel:'warning', comd:'Carbón Energético', msg:'Variación intradiaria superó 3% — monitoreando', fecha: hoy() },
  { hora:'11:00', nivel:'info',    comd:'Roca Fosfática',    msg:'Precio tocó resistencia $88.50', fecha: hoy() },
  { hora:'08:00', nivel:'info',    comd:'General',           msg:'Apertura de mercados asiáticos sin novedades', fecha: hoy() },
  { hora:'22:00', nivel:'warning', comd:'Carbón Energético', msg:'Noticias de sobreoferta indonesia presionan precios', fecha: ayer() },
  { hora:'16:45', nivel:'info',    comd:'Carbón Coquizable', msg:'Acuerdo siderúrgico europeo impulsó precio +1.5%', fecha: ayer() }
];

function hoy()  { return new Date().toLocaleDateString('es-ES',{day:'numeric',month:'short'}); }
function ayer() { const d=new Date(); d.setDate(d.getDate()-1); return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'}); }

function evaluarAlertas() {
  const panel = document.getElementById('alertas-panel');
  panel.innerHTML = ALERTAS_DEMO.map(a => `
    <div class="alert-item ${a.nivel} mb-2">
      <span class="alert-icon">${a.icon}</span>
      <div style="flex:1">
        <div style="font-size:.82rem;font-weight:600;margin-bottom:2px">${a.comd}</div>
        <div style="font-size:.85rem">${a.msg}</div>
        <div style="font-size:.7rem;opacity:.5;margin-top:2px">${new Date().toLocaleTimeString('es-ES')}</div>
      </div>
    </div>
  `).join('');
  document.getElementById('alert-count').textContent = ALERTAS_DEMO.length;

  const hist = document.getElementById('historial-alertas');
  hist.innerHTML = HISTORIAL_DEMO.map(h => `
    <div class="stat-row">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="badge ${h.nivel==='warning'?'bg-warning text-dark':h.nivel==='critical'?'bg-danger':'bg-secondary'}" style="font-size:.65rem">${h.nivel.toUpperCase()}</span>
        <span class="fs-xs"><strong>${h.comd}</strong> — ${h.msg}</span>
      </div>
      <span class="fs-xs text-muted">${h.fecha} ${h.hora}</span>
    </div>
  `).join('');
}

document.addEventListener('DOMContentLoaded', evaluarAlertas);
</script>
</body>
</html>
